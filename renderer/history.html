<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src file:; media-src file:; style-src 'self' 'unsafe-inline';">
	<title>前紙 の表示履歴</title>
	<link rel="stylesheet" href="history.css">
</head>
<body>
	<div class="titlebar">
		<img class="titlebar-icon" src="../assets/icon.ico" alt="" aria-hidden="true">
		<div class="titlebar-title" data-i18n="history.windowTitle">前紙 の表示履歴</div>
	</div>
	<main id="gallery" class="gallery">
		<p id="empty" class="empty hidden" data-i18n="history.empty">まだ履歴がありません。表示された画像や動画が、新しい順にここへ並びます。</p>
		<div id="columns" class="columns"></div>
	</main>
	<script src="history.js"></script>
</body>
</html>
